<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" width="220" height="230">
  <defs>
    <!-- Die-Cut Vinyl Sticker Outer Shadow -->
    <filter id="stickerBaseShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#363636"/>
    </pattern>
  </defs>

  <!-- Thick Die-Cut White Vinyl Border -->
  <rect x="8" y="8" width="204" height="214" rx="16" ry="16" fill="white" stroke="#e0e0e0" stroke-width="1" filter="url(#stickerBaseShadow)"/>

  <!-- Main Card Body -->
  <rect x="12" y="12" width="196" height="206" rx="13" ry="13" fill="url(#cardGrad)"/>

  <!-- Background Dot Grid -->
  <rect x="14" y="14" width="192" height="202" rx="11" ry="11" fill="url(#dotGrid)" opacity="0.7"/>

  <!-- Top Header Tag -->
  <rect x="22" y="24" width="78" height="17" rx="4" fill="#1A885C"/>
  <text x="61" y="36" fill="#ffffff" font-family="'Departure Mono', monospace, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.8">MODIFIER</text>

  <!-- Tag ID -->
  <text x="196" y="36" fill="#888888" font-family="'Departure Mono', monospace, sans-serif" font-size="8" text-anchor="end" letter-spacing="0.5">ID: #02</text>

  <!-- Subtle Divider -->
  <line x1="22" y1="47" x2="198" y2="47" stroke="#333333" stroke-width="1"/>

  <!-- Main Title -->
  <text x="24" y="78" fill="#ffffff" font-family="'BioRhyme', 'Departure Mono', monospace, serif" font-size="25" font-weight="800" letter-spacing="-0.5">ABOUT</text>
  <circle cx="122" cy="74" r="3.5" fill="#1A885C"/>

  <!-- Subtitle -->
  <text x="25" y="96" fill="#a0a0a0" font-family="'Departure Mono', monospace, sans-serif" font-size="8.5" letter-spacing="1.2">CREATIVE DEV // 3D</text>

  <!-- Center Tactile Terminal Display Box -->
  <rect x="22" y="108" width="176" height="74" rx="7" fill="#121212" stroke="#2b2b2b" stroke-width="1.2"/>

  <!-- 3D Isometric Wireframe Cube Icon -->
  <g transform="translate(35, 122)">
    <!-- Top Face -->
    <polygon points="22,4 40,14 22,24 4,14" fill="#222222" stroke="#1A885C" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="4,14 22,24 22,44 4,34" fill="#1a1a1a" stroke="#1A885C" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="22,24 40,14 40,34 22,44" fill="#292929" stroke="#1A885C" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Vertex Nodes -->
    <circle cx="22" cy="4" r="1.8" fill="#ffffff"/>
    <circle cx="40" cy="14" r="1.8" fill="#ffffff"/>
    <circle cx="4" cy="14" r="1.8" fill="#ffffff"/>
    <circle cx="22" cy="24" r="2.2" fill="#ffffff"/>
    <circle cx="22" cy="44" r="1.8" fill="#ffffff"/>
    <circle cx="4" cy="34" r="1.8" fill="#ffffff"/>
    <circle cx="40" cy="34" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Terminal Info Text Lines -->
  <g transform="translate(88, 126)">
    <text x="0" y="10" fill="#707070" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5" letter-spacing="0.5">STATUS</text>
    <text x="50" y="10" fill="#1A885C" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5" font-weight="700">ONLINE</text>

    <text x="0" y="24" fill="#707070" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5" letter-spacing="0.5">TARGET</text>
    <text x="50" y="24" fill="#cccccc" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5">PAGE/HOST</text>

    <text x="0" y="38" fill="#707070" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5" letter-spacing="0.5">VERB</text>
    <text x="50" y="38" fill="#cccccc" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5">REVEAL BIO</text>

    <text x="0" y="52" fill="#707070" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5" letter-spacing="0.5">SCOPE</text>
    <text x="50" y="52" fill="#ffffff" font-family="'Departure Mono', monospace, sans-serif" font-size="7.5">MODIFIER</text>
  </g>

  <!-- Bottom Interaction Micro-Hint Bar -->
  <rect x="22" y="190" width="176" height="18" rx="4" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="0.8"/>
  <circle cx="32" cy="199" r="2.5" fill="#1A885C"/>
  <text x="40" y="202.5" fill="#888888" font-family="'Departure Mono', monospace, sans-serif" font-size="7" letter-spacing="0.6">CLICK: SLEEP/WAKE • DRAG: MODIFY</text>
</svg>
