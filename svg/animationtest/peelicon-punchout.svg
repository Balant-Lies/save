<svg width="305" height="317" viewBox="0 0 305 317" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
svg { overflow: visible; }

/* 1. Main Dark Underside Fill Animation */
@keyframes kf_main_fill {
  0%, 4.68% {
    fill: #8C8585;
    animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
  }
  91.63%, 100% {
    fill: #000000;
  }
}

/* 2. Peel Flap Motion & Fill (Exact Original Trajectory: moves +7.145px, +45.276px in world space) */
@keyframes kf_peel_transform {
  0%, 4.68% {
    transform: translate(246.888px, 210.66px) rotate(111.625deg);
    animation-timing-function: cubic-bezier(0, 0.274, 0.58, 1);
  }
  91.63%, 100% {
    transform: translate(254.033px, 255.936px) rotate(111.625deg);
  }
}
@keyframes kf_peel_fill {
  0%, 4.68% {
    fill: #8C8585;
    animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
  }
  91.63%, 100% {
    fill: #000000;
  }
}

/* 3. Inverse Clip Punch-Out Motion (Exact Original Trajectory: moves +4.829px, +18.745px in world space) */
@keyframes kf_inverseclip_transform {
  0%, 4.68% {
    transform: translate(148.874px, 226.758px) rotate(-10.7228deg);
    animation-timing-function: cubic-bezier(0, 0.274, 0.58, 1);
  }
  91.63%, 100% {
    transform: translate(153.703px, 245.503px) rotate(-10.7228deg);
  }
}

/* Animated Classes */
.anim-main {
  animation: kf_main_fill 0.8s linear infinite;
}
.anim-peel {
  transform-origin: 0 0;
  animation:
    kf_peel_transform 0.8s linear infinite,
    kf_peel_fill 0.8s linear infinite;
}
.anim-inverseclip {
  transform-origin: 0 0;
  animation: kf_inverseclip_transform 0.8s linear infinite;
}
</style>

<defs>
  <!-- THE PUNCH-OUT MASK:
       White keeps everything visible.
       Black (#inverseclip) punches out any vector layers below it into empty transparency!
  -->
  <mask id="inverseClipPunchout" maskUnits="userSpaceOnUse" x="0" y="0" width="305" height="317">
    <rect width="100%" height="100%" fill="white" />
    <path id="mask_inverseclip" class="anim-inverseclip" d="M32.3323 0.929956L81.3395 0L109.556 65.0203L0 66.9418L32.3323 0.929956Z" fill="black" />
  </mask>
</defs>

<!-- Vector layers below it, punched out by the inverse clip! -->
<g id="Frame_2147260676" mask="url(#inverseClipPunchout)">
  <!-- 1. White Underside Border -->
  <path id="bg" transform="translate(151.867 223.861) rotate(-72.9716)" d="M31.7876 0L59.3165 47.6814H4.25873L31.7876 0Z" fill="white"/>

  <!-- 2. Dark Adhesive Underside -->
  <path id="main" class="anim-main" transform="translate(159.813 224.784) rotate(-72.9716)" d="M31.7876 0L59.3165 47.6814H4.25873L31.7876 0Z" fill="black"/>

  <!-- 3. Folded Flap (Peel) -->
  <path id="peel" class="anim-peel" d="M33.0869 -0.75L60.6152 46.9316L61.915 49.1816H1.66113L2.95996 46.9316L30.4883 -0.75L31.7881 -3L33.0869 -0.75Z" fill="black" stroke="white" stroke-width="3"/>
</g>
</svg>
