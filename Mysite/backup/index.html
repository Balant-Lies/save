<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <svg width="0" height="0" style="position:absolute;">
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="blackBase" />
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="whiteBase" />
      <feDisplacementMap in="blackBase" in2="noise" scale="7" result="warpBlack" />
      <feDisplacementMap in="whiteBase" in2="noise" scale="7" result="warpWhite" />
      <feComposite in="warpWhite" in2="warpBlack" operator="out" result="whiteAlpha" />
      <feComposite in="warpBlack" in2="SourceAlpha" operator="out" result="blackAlpha" />
      <feFlood flood-color="#ffffff" />
      <feComposite in2="whiteAlpha" operator="in" result="whiteStroke" />
      <feFlood flood-color="#000000" />
      <feComposite in2="blackAlpha" operator="in" result="blackStroke" />
      <feMerge>
        <feMergeNode in="whiteStroke" />
        <feMergeNode in="blackStroke" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </svg>

  <main class="grid">
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" />
          <circle class="pin pin-1" r="3" /><circle class="pin pin-2" r="3" /><circle class="pin pin-3" r="3" /><circle class="pin pin-4" r="3" /><circle class="pin pin-5" r="3" /><circle class="pin pin-6" r="3" /><circle class="pin pin-7" r="3" />
          <!-- The 3 Rotating Squares (Diamonds) -->
          <g class="sq-group sq-lime"><polygon points="-6,0 0,-6 6,0 0,6" fill="lime" /></g>
          <g class="sq-group sq-blue"><polygon points="-6,0 0,-6 6,0 0,6" fill="blue" /></g>
          <g class="sq-group sq-magenta"><polygon points="-6,0 0,-6 6,0 0,6" fill="magenta" /></g>
        </svg>
      </article>
    </div>
    
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" />
          <circle class="pin pin-1" r="3" /><circle class="pin pin-2" r="3" /><circle class="pin pin-3" r="3" /><circle class="pin pin-4" r="3" /><circle class="pin pin-5" r="3" /><circle class="pin pin-6" r="3" /><circle class="pin pin-7" r="3" />
        </svg>
      </article>
    </div>

    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" />
          <circle class="pin pin-1" r="3" /><circle class="pin pin-2" r="3" /><circle class="pin pin-3" r="3" /><circle class="pin pin-4" r="3" /><circle class="pin pin-5" r="3" /><circle class="pin pin-6" r="3" /><circle class="pin pin-7" r="3" />
        </svg>
      </article>
    </div>

    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" />
          <circle class="pin pin-1" r="3" /><circle class="pin pin-2" r="3" /><circle class="pin pin-3" r="3" /><circle class="pin pin-4" r="3" /><circle class="pin pin-5" r="3" /><circle class="pin pin-6" r="3" /><circle class="pin pin-7" r="3" />
        </svg>
      </article>
    </div>
  </main>
</body>

</html>
