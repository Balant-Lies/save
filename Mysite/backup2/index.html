<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- The Noise Engine -->
  <svg width="0" height="0" style="position:absolute;">
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" result="noise" />
      <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="blackBase" />
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="whiteBase" />
      <feDisplacementMap in="blackBase" in2="noise" scale="7" result="warpBlack" />
      <feDisplacementMap in="whiteBase" in2="noise" scale="7" result="warpWhite" />
      <feComposite in="warpWhite" in2="warpBlack" operator="out" result="whiteAlpha" />
      <feComposite in="warpBlack" in2="SourceAlpha" operator="out" result="blackAlpha" />
      <feFlood flood-color="#ffffff" />
      <feComposite in2="whiteAlpha" operator="in" result="whiteStroke" />
      <feFlood flood-color="#000000" />
      <feComposite in2="blackAlpha" operator="in" result="blackStroke" />
      <feMerge>
        <feMergeNode in="whiteStroke" />
        <feMergeNode in="blackStroke" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Triangle Static Edge Distortion (Boil) -->
    <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <main class="grid">
    <!-- CARD 1 -->
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" d="M 60,0 L 60,20 L 60,40 L 60,60 L 40,60 L 20,60 L 0,60 Z" />
          <g class="sq-A" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="blue" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-B" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="lime" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-C" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="magenta" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
        </svg>
      </article>
    </div>

    <!-- CARD 2 -->
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" d="M 60,0 L 60,20 L 60,40 L 60,60 L 40,60 L 20,60 L 0,60 Z" />
          <g class="sq-A" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="blue" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-B" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="lime" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-C" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="magenta" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
        </svg>
      </article>
    </div>

    <!-- CARD 3 -->
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" d="M 60,0 L 60,20 L 60,40 L 60,60 L 40,60 L 20,60 L 0,60 Z" />
          <g class="sq-A" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="blue" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-B" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="lime" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
          <g class="sq-C" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="magenta" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>
        </svg>
      </article>
    </div>

    <!-- CARD 4 -->
    <div class="wrap">
      <article class="card">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" d="M 60,0 L 60,20 L 60,40 L 60,60 L 40,60 L 20,60 L 0,60 Z" />
          <g class="sq-A" opacity="0"><polygon points="-8,0 0,-8 8,0 0,8" fill="blue" stroke="black" stroke-width="2" stroke-linejoin="round" /></g>

        </svg>
      </article>
    </div>
  </main>

  <!-- Load GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Load our custom logic -->
  <script src="app.js"></script>
