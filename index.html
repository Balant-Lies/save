<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- All heavy SVG filters have been completely removed! Everything is pure Math now. test. -->

  <main class="grid">
    <!-- CARD 1 -->
    <div class="wrap">
      <svg class="card-bg-svg" width="300" height="250">
        <path class="card-bg-path" fill="#ffffff" stroke="black" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <svg width="0" height="0" style="position: absolute;">
        <clipPath id="card-clip-0">
          <path class="card-clip-path" />
        </clipPath>
      </svg>

      <article class="card" style="clip-path: url(#card-clip-0);">
        <div class="inner-rect"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" fill="#ffffff" stroke="white" stroke-width="2" stroke-linejoin="round" />
          <path class="inner-triangle-path" fill="none" stroke="black" stroke-width="2" stroke-linejoin="round" />
          <g class="sq-A" opacity="0">
            <path class="sq-path" fill="blue" stroke="black" stroke-width="1" stroke-linejoin="round" />
          </g>
          <g class="sq-B" opacity="0">
            <path class="sq-path" fill="lime" stroke="black" stroke-width="1" stroke-linejoin="round" />
          </g>
          <g class="sq-C" opacity="0">
            <path class="sq-path" fill="magenta" stroke="black" stroke-width="1" stroke-linejoin="round" />
          </g>
        </svg>
      </article>
    </div>
