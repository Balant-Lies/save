  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-sticker-surface="page" data-surface-id="page">
  <!-- All heavy SVG filters have been completely removed! Everything is pure Math now. -->


  <main class="grid">
    <!-- CARD 1 -->
    <div class="wrap">
      <div class="card-behind">
        <div class="card-behind-content">
          <span class="card-behind-text">Project 1</span>
          <div class="card-loading-bar">
            <div class="card-loading-progress"></div>
          </div>
        </div>
      </div>
      <svg class="card-bg-svg" width="300" height="250">
        <path class="card-bg-path" fill="#F2F2F2" stroke="black" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <svg width="0" height="0" style="position: absolute;">
        <clipPath id="card-clip-0">
          <path class="card-clip-path" />
        </clipPath>
      </svg>

      <article class="card" style="clip-path: url(#card-clip-0);">
        <div class="card-header">
          <span class="card-title">Project A</span>
        </div>
        <div class="inner-rect" data-sticker-surface="card" data-surface-id="project-a"></div>
        <div class="hitbox"></div>
        <svg class="triangle-svg" viewBox="0 0 120 120">
          <path class="triangle-path" stroke-width="2" stroke-linejoin="round" />
          <path class="inner-triangle-outer-path" stroke-linejoin="round" />
          <path class="inner-triangle-path" stroke-width="2" stroke-linejoin="round" />
          <g class="sq-A" opacity="0" tabindex="0" role="button" aria-label="Summary">
            <rect class="custom-focus" x="-11" y="-11" width="22" height="22" rx="4" fill="none" stroke="#005fcc"
              stroke-width="2" vector-effect="non-scaling-stroke" opacity="0" />
            <path class="sq-path" stroke="black" stroke-width="1" stroke-linejoin="round" />
          </g>
          <g class="sq-B" opacity="0" tabindex="0" role="button" aria-label="View Project">
            <rect class="custom-focus" x="-11" y="-11" width="22" height="22" rx="4" fill="none" stroke="#005fcc"
              stroke-width="2" vector-effect="non-scaling-stroke" opacity="0" />
            <path class="sq-path" stroke="black" stroke-width="1" stroke-linejoin="round" />
          </g>
          <g class="sq-C" opacity="0" tabindex="0" role="button" aria-label="Media">
            <rect class="custom-focus" x="-11" y="-11" width="22" height="22" rx="4" fill="none" stroke="#005fcc"
              stroke-width="2" vector-effect="non-scaling-stroke" opacity="0" />

          </g>
        </svg>

    </div>

  </main>

  <!-- 2 FPS Hand-Drawn Boil Filter for Sticker Art -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
    <defs>
      <filter id="stickerBoilFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence id="boilTurbulence" type="fractalNoise" baseFrequency="0.038" numOctaves="2" seed="1" result="noise" />
        <feDisplacementMap id="boilDisplacement" in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Modular Draggable Work Navigation Sticker (Home Sticker) -->
  <div class="sticker-root" id="stickerRoot" data-sticker-id="work" data-sticker-surface="sticker" role="button" aria-label="Work CRT Sticker">

    <!-- Draggable Sticker Body -->
    <div class="sticker-body" id="stickerBody">
      <div class="sticker-shadow-wrap">
        <div class="sticker-art-wrap" id="stickerArtWrap">
          <!-- Masked PBR Specular Glossy Sheen Layer with Base Art for True Pixel Blend Modes -->
          <div class="sticker-highlight-layer" id="highlightLayer">
            <img class="sticker-base-png" src="svg/workstickerpng.png" alt="CRT Work Sticker">
            <div class="diffuse-shadow"></div>
            <div class="specular-hotspot"></div>
            <div class="fresnel-rim"></div>
            <div class="env-reflect"></div>
            <div class="washout"></div>
            <div class="iridescence"></div>
          </div>

          <!-- 100% Vector Layers Punch-Out Corner Peel Affordance (Applied by default) -->
          <div class="sticker-peel-overlay peel-state-active" id="stickerPeelOverlay">
            <svg class="peel-svg" id="peelSvg" viewBox="0 0 305 317" preserveAspectRatio="none">
              <defs>
                <mask id="stickerPeelMask" maskUnits="userSpaceOnUse" x="0" y="0" width="305" height="317">
                  <rect width="100%" height="100%" fill="white" />
                  <path id="stickerMaskInverseClip" class="peel-mask-path" transform="translate(148.874 226.758) rotate(-10.7228)" d="M32.3323 0.929956L81.3395 0L109.556 65.0203L0 66.9418L32.3323 0.929956Z" fill="#000000" />
                </mask>
              </defs>
              <g id="stickerPeelVectorGroup" mask="url(#stickerPeelMask)">
                <path id="stickerPeelBg" transform="translate(151.867 223.861) rotate(-72.9716)" d="M31.7876 0L59.3165 47.6814H4.25873L31.7876 0Z" fill="white"/>
                <path id="stickerPeelMain" class="peel-main-path" transform="translate(159.813 224.784) rotate(-72.9716)" d="M31.7876 0L59.3165 47.6814H4.25873L31.7876 0Z" fill="#8C8585"/>
                <path id="stickerPeelFlap" class="peel-flap-path" transform="translate(246.888 210.66) rotate(111.625)" d="M33.0869 -0.75L60.6152 46.9316L61.915 49.1816H1.66113L2.95996 46.9316L30.4883 -0.75L31.7881 -3L33.0869 -0.75Z" fill="#8C8585" stroke="white" stroke-width="3"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular Draggable About Modifier Sticker (Circle Placeholder, Inactive by Default) -->
  <div class="sticker-root sticker-about is-sleeping" id="aboutStickerRoot" data-sticker-id="about" data-sticker-surface="sticker" role="button" aria-label="About Me Modifier Sticker">

                <path id="aboutPeelMain" class="peel-main-path" transform="translate(159.813 224.784) rotate(-72.9716)" d="M31.7876 0L59.3165 47.6814H4.25873L31.7876 0Z" fill="#8C8585"/>
                <path id="aboutPeelFlap" class="peel-flap-path" transform="translate(246.888 210.66) rotate(111.625)" d="M33.0869 -0.75L60.6152 46.9316L61.915 49.1816H1.66113L2.95996 46.9316L30.4883 -0.75L31.7881 -3L33.0869 -0.75Z" fill="#8C8585" stroke="white" stroke-width="3"/>
